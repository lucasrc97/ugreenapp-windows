[workspace]
resolver = "3"
members = ["crates/ugreen-core", "crates/ugreen-cli", "crates/ugreen-gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ugreen-core = { path = "crates/ugreen-core" }
